{% extends "base.html" %}
{% block content %}
<h1>{{ page_title }}</h1>
<form method="post">
  {{ form.hidden_tag() }}
  <label>{{ form.name.label }}{{ form.name() }}</label>
  <label>{{ form.kind.label }}{{ form.kind() }}</label>
  <label>{{ form.destination.label }}{{ form.destination() }}</label>
  <label>{{ form.is_active() }} {{ form.is_active.label.text }}</label>
  {{ form.submit(class_='btn') }}
</form>
{% endblock %}
