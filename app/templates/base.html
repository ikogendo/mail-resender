<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Mail Resender{% endblock %}</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #f8f9fa; }
      nav { background: #212529; padding: 0.75rem 1rem; }
      nav a { color: #fff; text-decoration: none; margin-right: 1rem; font-size: 0.95rem; }
      .container { max-width: 1100px; margin: 1.5rem auto; background: #fff; border-radius: 8px; padding: 1rem 1.25rem; }
      .flash-success { background: #d1e7dd; padding: .5rem .75rem; border-radius: 6px; margin-bottom: .75rem; }
      .flash-error { background: #f8d7da; padding: .5rem .75rem; border-radius: 6px; margin-bottom: .75rem; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border-bottom: 1px solid #dee2e6; padding: .5rem; text-align: left; }
      .actions { margin: .75rem 0; }
      label { display: block; margin-top: .5rem; }
      input, select, textarea { width: 100%; box-sizing: border-box; margin-top: .25rem; padding: .4rem; }
      textarea { min-height: 120px; }
      button, .btn { display: inline-block; padding: .45rem .75rem; text-decoration: none; border: 0; border-radius: 4px; cursor: pointer; background: #0d6efd; color: #fff; }
      .muted { color: #6c757d; }
    </style>
  </head>
  <body>
    <nav>
      <a href="{{ url_for('status.dashboard') }}">Status</a>
      <a href="{{ url_for('profiles.list_profiles') }}">Profiles</a>
      <a href="{{ url_for('accounts.list_accounts') }}">Mail Accounts</a>
      <a href="{{ url_for('channels.list_channels') }}">Channels</a>
      <a href="{{ url_for('events.recent_events') }}">Events</a>
      <a href="{{ url_for('test_send.send_test_notification') }}">Test send</a>
    </nav>
    <main class="container">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash-{{ 'success' if category == 'success' else 'error' }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
