[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailbridge"
version = "0.1.0"
description = "Mail bridge service with Flask UI and polling worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0",
  "Flask-WTF>=1.2",
  "SQLAlchemy>=2.0",
  "requests>=2.32",
  "httpx>=0.27",
  "tenacity>=9.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
